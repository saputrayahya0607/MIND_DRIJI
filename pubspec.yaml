name: mind_driji
description: "MIND DRIJI - Monitoring Digital Wellbeing"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  http: ^1.1.0
  app_usage: ^4.1.0
  usage_stats: ^1.3.1
  google_sign_in: ^7.1.1
  supabase_flutter: 2.6.0
  cupertino_icons: ^1.0.8
  get_storage: ^2.1.1
  flutter_native_splash: ^2.4.4
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  color_dark: "#FFFFFF"
  image_dark: "assets/images/logo.png"
  android_gravity: center
  ios_content_mode: center
  web: false